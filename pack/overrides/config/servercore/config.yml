commands:
  status-enabled: true
  mobcaps-enabled: true
  colors:
    primary: 'dark_aqua'
    secondary: 'green'
    tertiary: 'aqua'


# Entities far from every player tick once a second instead of 20 times (Paper's activation range). Immunity checks
# still tick them fully while they fall, swim, burn, take damage or are newly spawned.
activation-range:
  enabled: true
  tick-new-entities: true
  use-vertical-range: false
  skip-non-immune: false
  villager-tick-panic: true
  villager-work-immunity-after: 20
  villager-work-immunity-for: 20
  # never throttled: machines and moving contraptions, things that must keep moving to work (items in farm streams,
  # minecarts), workers that act away from players (colonists, Robit, Ars Nouveau helpers), the pack's quest NPCs,
  # and bosses (a boss fight must not stutter when the player steps back)
  excluded-entity-types:
    - 'minecraft:warden'
    - 'minecraft:ghast'
    - 'minecraft:ender_dragon'
    - 'minecraft:wither'
    - 'minecraft:elder_guardian'
    - 'minecraft:item'
    - 'minecraft:experience_orb'
    - 'minecraft:minecart'
    - 'minecraft:chest_minecart'
    - 'minecraft:furnace_minecart'
    - 'minecraft:hopper_minecart'
    - 'minecraft:tnt_minecart'
    - 'minecraft:spawner_minecart'
    - 'minecraft:command_block_minecart'
    - 'create:contraption'
    - 'create:carriage_contraption'
    - 'create:gantry_contraption'
    - 'create:stationary_contraption'
    - 'create:package'
    - 'aeronautics:propeller_bearing_contraption'
    - 'minecolonies:citizen'
    - 'minecolonies:visitor'
    - 'minecolonies:mercenary'
    - 'minecolonies:mcminecart'
    - 'minecolonies:sittingentity'
    - 'mekanism:robit'
    - 'ars_nouveau:starbuncle'
    - 'ars_nouveau:drygmy'
    - 'ars_nouveau:whirlisprig'
    - 'ars_nouveau:wixie'
    - 'ars_nouveau:amethyst_golem'
    - 'ars_nouveau:bookwyrm'
    - 'wilds_core:wanderer'
    - 'cataclysm:ancient_remnant'
    - 'cataclysm:ender_guardian'
    - 'cataclysm:ignis'
    - 'cataclysm:maledictus'
    - 'cataclysm:netherite_monstrosity'
    - 'cataclysm:scylla'
    - 'cataclysm:the_harbinger'
    - 'cataclysm:the_leviathan'
    - 'mowziesmobs:ferrous_wroughtnaut'
    - 'mowziesmobs:frostmaw'
    - 'mowziesmobs:umvuthi'
    - 'mowziesmobs:naga'
    - 'mowziesmobs:sculptor'
    - 'iceandfire:fire_dragon'
    - 'iceandfire:ice_dragon'
    - 'iceandfire:lightning_dragon'
    - 'iceandfire:sea_serpent'
    - 'iceandfire:cyclops'
    - 'iceandfire:hydra'
    - 'iceandfire:gorgon'
    - 'iceandfire:dread_lich'
    - 'twilightforest:naga'
    - 'twilightforest:lich'
    - 'twilightforest:hydra'
    - 'twilightforest:minoshroom'
    - 'twilightforest:knight_phantom'
    - 'twilightforest:ur_ghast'
    - 'twilightforest:alpha_yeti'
    - 'twilightforest:snow_queen'
    - 'twilightforest:plateau_boss'
    - 'aether:slider'
    - 'aether:valkyrie_queen'
    - 'aether:sun_spirit'
    - 'irons_spellbooks:dead_king'
    - 'irons_spellbooks:fire_boss'
    - 'irons_spellbooks:citadel_keeper'
    - 'ars_nouveau:wilden_boss'
  default-activation-type:
    activation-range: 16
    tick-interval: 20
    wakeup-interval: -1
    extra-height-up: false
    extra-height-down: false

  # ranges close to Paper's defaults (ServerCore's own are shorter): a mob 32 blocks away still acts normally
  custom-activation-types:
    - name: 'raider'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:raider'

    - name: 'water'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:water_animal'

    - name: 'villager'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:villager'

    - name: 'zombie'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:zombie'
        - 'minecraft:husk'

    - name: 'monster-below'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: true
      entity-matcher:
        - 'minecraft:creeper'
        - 'minecraft:slime'
        - 'minecraft:magma_cube'
        - 'minecraft:hoglin'

    - name: 'flying-monster'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:phantom'

    - name: 'monster'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:monster'

    - name: 'animal'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:animal'
        - 'typeof:ambient'

    - name: 'creature'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:mob'
