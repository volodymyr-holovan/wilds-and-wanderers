# ServerCore for Wilds & Wanderers (30.10.2026).
# The server's CPU runs one game thread; with 6–8 players spread over the world a tick took 60–70 ms instead of 50
# (spark: entity ticking ~54%, natural spawning ~25%). Everything below trades far-away simulation for a full 20 TPS:
# mobs far from every player tick once a second, spawning is not attempted every tick for categories that never fill,
# and under load the server narrows the spawning / simulation area by itself and widens it back when it recovers.
# Most of these settings can be reloaded without restarting using /servercore reload.

features:
  prevent-moving-into-unloaded-chunks: false
  autosave-interval-seconds: 300
  xp-merge-fraction: 40
  xp-merge-radius: 0.5
  # items lying in heaps (mob farms, mining) merge from further away: fewer item entities to tick and send
  item-merge-radius: 1.5
  lobotomize-villagers:
    # villagers locked in 1x1 trading cells tick once a second; trading still works
    enabled: true
    tick-interval: 20


dynamic:
  enabled: true
  # step down while the average tick is above this, step back up when it is well below
  target-mspt: 40
  # match server.properties (simulation 6, view 12): these are the values the server returns to when it is not loaded
  default-values:
    CHUNK_TICK_DISTANCE: 6
    MOBCAP_PERCENTAGE: 100
    SIMULATION_DISTANCE: 6
    VIEW_DISTANCE: 12

  # in this order: fewer mobs, then spawning and random ticks (crop growth) only near players, then a smaller
  # simulated area; the view distance (what players see) is the very last and slow to change
  dynamic-settings:
    - setting: 'MOBCAP_PERCENTAGE'
      max: 100
      min: 70
      increment: 10
      interval: 15

    - setting: 'CHUNK_TICK_DISTANCE'
      max: 6
      min: 4
      increment: 1
      interval: 15

    - setting: 'SIMULATION_DISTANCE'
      max: 6
      min: 4
      increment: 1
      interval: 20

    - setting: 'MOBCAP_PERCENTAGE'
      max: 70
      min: 50
      increment: 10
      interval: 15

    - setting: 'VIEW_DISTANCE'
      max: 12
      min: 8
      increment: 1
      interval: 150


# huge animal pens tick every animal every tick: no more than 48 of one kind can be bred within 64 blocks
breeding-cap:
  enabled: true
  villagers:
    limit: 32
    range: 64
    unlimited-height: false
  animals:
    limit: 48
    range: 64
    unlimited-height: false


mob-spawning:
  zombie-reinforcements:
    enforce-mobcap: false
    additional-capacity: 32
  nether-portal-randomticks:
    enforce-mobcap: true
    additional-capacity: 32
  monster-spawners:
    enforce-mobcap: false
    additional-capacity: 32
  infested:
    enforce-mobcap: false
    additional-capacity: 32

  # Mobcaps are vanilla's (and the mods'). Spawn intervals: every category below its cap tries to spawn in every chunk
  # around every player, and each try looks up the biome; categories that are nearly always below the cap (bats,
  # fish, glares, Aether mobs outside the Aether...) tried every tick for nothing. Monsters try every other tick.
  categories:
    - category: 'MONSTER'
      mobcap: 70
      spawn-interval: 2
      despawn-distance: 128

    - category: 'CREATURE'
      mobcap: 10
      spawn-interval: 400
      despawn-distance: 128

    - category: 'AMBIENT'
      mobcap: 10
      spawn-interval: 20
      despawn-distance: 128

    - category: 'AXOLOTLS'
      mobcap: 5
      spawn-interval: 20
      despawn-distance: 128

    - category: 'UNDERGROUND_WATER_CREATURE'
      mobcap: 5
      spawn-interval: 10
      despawn-distance: 128

    - category: 'WATER_CREATURE'
      mobcap: 5
      spawn-interval: 10
      despawn-distance: 128

    - category: 'WATER_AMBIENT'
      mobcap: 20
      spawn-interval: 10
      despawn-distance: 64

    - category: 'AETHER_AETHER_AERWHALE'
      mobcap: 1
      spawn-interval: 20
      despawn-distance: 128

    - category: 'AETHER_AETHER_DARKNESS_MONSTER'
      mobcap: 5
      spawn-interval: 4
      despawn-distance: 128

    - category: 'AETHER_AETHER_SKY_MONSTER'
      mobcap: 4
      spawn-interval: 4
      despawn-distance: 128

    - category: 'AETHER_AETHER_SURFACE_MONSTER'
      mobcap: 15
      spawn-interval: 4
      despawn-distance: 128

    - category: 'ALEXSCAVES_CAVE_CREATURE'
      mobcap: 10
      spawn-interval: 400
      despawn-distance: 128

    - category: 'ALEXSCAVES_DEEP_SEA_CREATURE'
      mobcap: 20
      spawn-interval: 10
      despawn-distance: 128

    - category: 'FRIENDSANDFOES_GLARES'
      mobcap: 15
      spawn-interval: 10
      despawn-distance: 128

    - category: 'FRIENDSANDFOES_RASCALS'
      mobcap: 1
      spawn-interval: 20
      despawn-distance: 128

    - category: 'HYBRID_AQUATIC_CEPHALOPOD'
      mobcap: 4
      spawn-interval: 10
      despawn-distance: 64

    - category: 'HYBRID_AQUATIC_CRITTER'
      mobcap: 4
      spawn-interval: 10
      despawn-distance: 64

    - category: 'HYBRID_AQUATIC_CRUSTACEAN'
      mobcap: 4
      spawn-interval: 10
      despawn-distance: 64

    - category: 'HYBRID_AQUATIC_FISH'
      mobcap: 10
      spawn-interval: 10
      despawn-distance: 64

    - category: 'HYBRID_AQUATIC_JELLY'
      mobcap: 4
